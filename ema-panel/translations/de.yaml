configuration:
  panel_host:
    name: Adresse der Anlage
    description: IP-Adresse oder Hostname der Übertragungseinheit im lokalen Netz (z. B. 192.168.178.99). Nur für die erste Anlage beim ersten Start; weitere Anlagen und Änderungen machst du in der App unter „Anlagen“.
  panel_port:
    name: Port der Anlage
    description: Standard ist 8016.
  user_group:
    name: Benutzergruppe
    description: Dieselbe Gruppennummer wie in der Anlagen-Einstellung der Original-App (meist 1).
  control_enabled:
    name: Steuern erlauben
    description: Aus = nur Ansicht (empfohlen zum Testen). An = Tasten, EIN/AUS und Taster senden echte Befehle. Lässt sich auch in der App unter ⚙ Einstellungen umschalten; eine Änderung hier gilt ab dem nächsten Start des Add-ons.
  poll_interval_ms:
    name: Abfrage-Intervall (ms)
    description: Wie oft der Zustand abgefragt wird. 1000 ist ein guter Wert. Auch in der App einstellbar; eine Änderung hier gilt ab dem nächsten Start.
  mqtt_entities:
    name: Entitäten in Home Assistant (MQTT)
    description: Zeigt Taster, LEDs und Anzeigen als Entitäten in Home Assistant (für Dashboards und Automationen, z. B. Einbruch-Benachrichtigung). Braucht den Mosquitto-Broker. Dafür hält das Add-on eine eigene Verbindung, die nur die Taster/LED-Seite liest und das Bedienteil frei lässt.
  mqtt_buttons:
    name: Taster in Home Assistant
    description: Bietet die Taster als Schaltflächen in Home Assistant an. Wirkt nur, wenn auch „Steuern erlauben“ an ist. Feuer, Wasser und Heizung bleiben reine Anzeige.
