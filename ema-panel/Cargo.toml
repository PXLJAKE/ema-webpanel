[package]
name = "ema-panel"
version = "0.7.1"
edition = "2021"
description = "Modern web keypad for an intrusion alarm panel (unofficial). Home Assistant add-on or standalone Docker container."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "io-util"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false }
roxmltree = "0.20"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
rumqttc = { version = "0.24", default-features = false }
aes = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
