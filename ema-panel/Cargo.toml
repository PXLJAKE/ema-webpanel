[package]
name = "ema-panel"
version = "0.2.0"
edition = "2021"
description = "Home Assistant add-on: modern web keypad for an intrusion alarm panel (unofficial)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "io-util"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false }
roxmltree = "0.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
