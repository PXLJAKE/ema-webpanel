configuration:
  panel_host:
    name: Panel address
    description: >-
      IP address or host name of the panel's IP transmitter on your network, e.g. 192.168.178.99.
      Only used to create the first system on the very first start. After that, add and edit
      systems in the app under "Systems".
  panel_port:
    name: Panel port
    description: Port of the IP transmitter. Usually 8016.
  user_group:
    name: User group
    description: >-
      Group number for the first system, the same as in the original app (usually 1). Later you
      set the group per system in the app.
  control_enabled:
    name: Allow control
    description: >-
      Off = view only, no commands are sent (recommended to start with). On = keypad keys, arm,
      disarm and the function buttons send real commands; arm, disarm and buttons ask first.
      You can also switch this in the app under ⚙ Settings. A change here takes effect when the
      add-on restarts.
  poll_interval_ms:
    name: Refresh interval (ms)
    description: >-
      How often the state is read while connected. 1000 (once a second) works well. Also
      adjustable in the app. A change here takes effect when the add-on restarts.
  mqtt_entities:
    name: Home Assistant entities (MQTT)
    description: >-
      Makes the panel's buttons, LEDs and indicators available as Home Assistant entities, for
      dashboards and automations such as an intrusion alert. Needs the Mosquitto broker add-on.
      Uses its own read-only connection that never takes the keypad, so the app and the real
      keypad stay usable.
  mqtt_buttons:
    name: Function buttons in Home Assistant
    description: >-
      Also offers the panel's function buttons as button entities. Only works while "Allow
      control" is on. Fire, water and heating indicators always stay display-only.
  language:
    name: Language
    description: >-
      Language of the app and the entity names. "auto" follows the language of Home Assistant
      (German or English, anything else becomes English). Changing it takes effect when the
      add-on restarts.
